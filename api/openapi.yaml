openapi: 3.1.0
info:
  title: Impromptu API
  version: 1.0.0
  description: |
    Users, their activities, and statuses (an activity with an optional note and an expiry).
    When the server has `API_KEY` set, every request needs `Authorization: Bearer <API_KEY>`.
    Without it, requests need no auth.
    Deletes are soft: the row stays in the database with `deletedAt` set and is no longer returned.

    ## Google Calendar statuses
    Once Google Calendar is connected, the server reads the rest of the user's day every 15 minutes.
    Within a minute of an event starting, it picks one of the standard activities for it (with
    Gemini, standing in for Muse) and creates a status with `source: CALENDAR`, starting and ending
    with the event, and `note: null`. A cancelled, declined or moved event removes its status; a
    changed end time moves `expiresAt`. All-day events, events marked Free, out-of-office and
    working-location events never become statuses. Fetch `GET /users/{userId}/statuses?active=true`
    to show them.
servers:
  - url: http://localhost:3000/api/v1
security:
  - {}
  - apiKey: []

paths:
  /activities:
    get:
      summary: List all standard activities
      description: |
        Every standard activity, in the app's curated order, e.g. to let someone choose activities while
        registering. Served from the built-in list, so it works without a user or a seeded database.
        These have no ids; use `GET /users/{userId}/activities` for the database rows (with ids) that
        statuses refer to.
      operationId: listStandardActivities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items:
                      type: object
                      required: [name, defaultDurationMinutes]
                      properties:
                        name: { type: string, description: Unique; the same name the database uses. }
                        defaultDurationMinutes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      summary: List all users
      description: |
        Users that aren't deleted, oldest first, a page at a time. To get the next page, pass the response's
        `nextCursor` as `cursor`; `nextCursor` is null on the last page.
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: The previous page's `nextCursor`.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users, nextCursor]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/search:
    post:
      summary: Find a user by email
      description: |
        Exact match, ignoring capitals and surrounding spaces. POST so the email stays out of the URL.
        Returns an empty list when nobody has that email.
      operationId: searchUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    maxItems: 1
                    items: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /feed:
    get:
      summary: Everyone with their current status
      description: |
        Public profiles only (no email). People with an active status come first, most recently
        started first; then everyone else by name. Up to 200 users.
      operationId: getFeed
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserWithStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/login:
    post:
      summary: Check an email and password
      description: Returns the user on success. No session token is issued yet.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: Missing or invalid API key, or wrong email or password.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /users/{userId}:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: Get a user
      operationId: getUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change the user's name or nickname
      description: Send only the fields that change. A null `nickname` removes it.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: { user: { $ref: "#/components/schemas/User" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a user
      description: The user is no longer returned, and their email can be used for a new account.
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/activities:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: List activities the user can pick
      description: The user's custom activities first, then the standard ones, each sorted by name.
      operationId: listActivities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a custom activity
      operationId: createActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActivityRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties: { activity: { $ref: "#/components/schemas/Activity" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/activities/{activityId}:
    parameters:
      - { $ref: "#/components/parameters/userId" }
      - { $ref: "#/components/parameters/activityId" }
    get:
      summary: Get an activity
      operationId: getActivity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties: { activity: { $ref: "#/components/schemas/Activity" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a custom activity
      description: Standard activities can't be deleted. Existing statuses keep pointing at the activity.
      operationId: deleteActivity
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/saved-activities:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: The activities the user picked as their own
      description: |
        Picked at sign-up; the app's status drop-down lists these. Same order as `GET /users/{userId}/activities`.
        Deleted custom activities drop out. Empty for users who never picked any.
      operationId: listSavedActivities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace the user's picked activities
      description: |
        Send at least one of `activityIds` or `standardActivityNames`. Every id must be a standard activity or
        one of the user's own, and every name must be in `GET /activities`, or nothing is saved. Standard
        activities sent by name get their database row on first use, so this works on an unseeded database.
      operationId: replaceSavedActivities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activityIds:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
                  description: Database rows, typically the user's own activities. Duplicates are ignored.
                standardActivityNames:
                  type: array
                  maxItems: 200
                  items: { type: string }
                  description: Names exactly as `GET /activities` lists them. Duplicates are ignored.
      responses:
        "200":
          description: The saved activities.
          content:
            application/json:
              schema:
                type: object
                required: [activities]
                properties:
                  activities:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/friends:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: People the user added, and what each can see
      description: |
        One-way: adding someone lets them see what the user allows; it doesn't let the user see theirs.
        Sorted by name. Sharing isn't applied to the feed yet; these are the user's choices.
      operationId: listFriends
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items: { $ref: "#/components/schemas/Friend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a friend by email, or change what they can see
      description: |
        Exact email match, ignoring capitals. If they're already a friend, only the access fields sent change.
        Someone new can see nothing unless the request says so.
      operationId: addFriend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                canSeeLocation: { type: boolean }
                canSeeNotes: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [friend]
                properties: { friend: { $ref: "#/components/schemas/Friend" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The user doesn't exist, or no one has that email.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /users/{userId}/friends/{friendId}:
    parameters:
      - { $ref: "#/components/parameters/userId" }
      - { $ref: "#/components/parameters/friendId" }
    patch:
      summary: Change what a friend can see
      operationId: updateFriend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                canSeeLocation: { type: boolean }
                canSeeNotes: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [friend]
                properties: { friend: { $ref: "#/components/schemas/Friend" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a friend
      operationId: removeFriend
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/statuses:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: List the user's statuses, newest first (up to 50)
      operationId: listStatuses
      parameters:
        - name: active
          in: query
          description: When `true`, only statuses that have started and not yet expired.
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Set a status (an activity with an optional note)
      operationId: createStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStatusRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { $ref: "#/components/schemas/Status" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/statuses/{statusId}:
    parameters:
      - { $ref: "#/components/parameters/userId" }
      - { $ref: "#/components/parameters/statusId" }
    get:
      summary: Get a status
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { $ref: "#/components/schemas/Status" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a status and its note
      operationId: deleteStatus
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/location:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    put:
      summary: Report the user's current position
      description: |
        Used only to find people nearby; never returned to anyone. Positions older than 2 hours are
        ignored, so people who stop reporting drop out of `nearby` on their own.
      operationId: updateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateLocationRequest" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Stop sharing the user's position
      description: Removes the stored position (a hard delete).
      operationId: deleteLocation
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/nearby:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: People nearby doing the same activity
      description: |
        People whose last position (from the past 2 hours) is within `radiusMeters` of the user's, and
        whose current status has the same activity as the user's, closest first. Empty when the user has no
        active status or no recent position. Each user has `distanceMeters`, rounded up to 100 m; positions
        are never returned.
      operationId: listNearby
      parameters:
        - name: radiusMeters
          in: query
          schema: { type: integer, minimum: 50, maximum: 50000, default: 1600 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [activity, radiusMeters, users]
                properties:
                  activity:
                    description: The user's current activity, or null without an active status.
                    oneOf:
                      - $ref: "#/components/schemas/ActivitySummary"
                      - { type: "null" }
                  radiusMeters: { type: integer }
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserWithStatus" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/note-requests:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: The past day's note requests, received and sent
      operationId: listNoteRequests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [incoming, outgoing]
                properties:
                  incoming: { type: array, items: { $ref: "#/components/schemas/NoteRequest" } }
                  outgoing: { type: array, items: { $ref: "#/components/schemas/NoteRequest" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Ask people nearby for a note
      description: |
        Every recipient must currently be in the user's `nearby` results (nearby and doing the same
        activity), or the whole request is refused with 403. Recipients who already have an open request
        from the user are skipped and listed in `skippedRecipientIds`. Requests expire after 3 hours.
      operationId: createNoteRequests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientIds]
              properties:
                recipientIds: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [requests, skippedRecipientIds]
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/NoteRequest" } }
                  skippedRecipientIds: { type: array, items: { type: string, format: uuid } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/note-requests/{requestId}/reply:
    parameters:
      - { $ref: "#/components/parameters/userId" }
      - { $ref: "#/components/parameters/requestId" }
    post:
      summary: Answer a note request
      description: Only the recipient, only while it's pending and unexpired. Location is optional.
      operationId: replyToNoteRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyToNoteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties: { request: { $ref: "#/components/schemas/NoteRequest" } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/note-requests/{requestId}/decline:
    parameters:
      - { $ref: "#/components/parameters/userId" }
      - { $ref: "#/components/parameters/requestId" }
    post:
      summary: Decline a note request
      operationId: declineNoteRequest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties: { request: { $ref: "#/components/schemas/NoteRequest" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/google-calendar:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: Whether Google Calendar is connected
      operationId: getGoogleCalendar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [googleCalendar]
                properties:
                  googleCalendar:
                    type: object
                    required: [connected]
                    properties: { connected: { type: boolean } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Start connecting Google Calendar
      description: |
        Open `authUrl` in ASWebAuthenticationSession. After Google's consent screen, the API redirects to
        `APP_REDIRECT_URL?result=connected|denied|expired|failed`. The link is valid for 10 minutes.
      operationId: connectGoogleCalendar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties: { authUrl: { type: string, format: uri } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Disconnect Google Calendar
      description: Revokes access. Calendar statuses already created stay.
      operationId: disconnectGoogleCalendar
      responses:
        "204": { description: Disconnected }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/google-calendar/events:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    get:
      summary: The rest of today's Google Calendar events
      description: |
        Read live from Google, up to midnight in the user's time zone; nothing is stored. Sorted by start
        time, cancelled events left out.
      operationId: listGoogleCalendarEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/CalendarEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/google-calendar/check:
    parameters: [{ $ref: "#/components/parameters/userId" }]
    post:
      summary: Check the calendar now
      description: |
        Re-reads today's events and creates statuses for events that have started, instead of waiting for the
        next minute's run. Useful for pull-to-refresh.
      operationId: checkGoogleCalendar
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check:
                    type: object
                    required: [eventsToday, statusesStarted]
                    properties:
                      eventsToday: { type: integer, description: Events from now until midnight. }
                      statusesStarted: { type: integer, description: Statuses created by this check. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /google-calendar/callback:
    get:
      summary: Google OAuth callback (called by Google, not the app)
      operationId: googleCalendarCallback
      security: []
      responses:
        "302": { description: "Redirect to APP_REDIRECT_URL with ?result=..." }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: The server's API_KEY. Only required when the server sets one.

  parameters:
    userId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    activityId: { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
    statusId: { name: statusId, in: path, required: true, schema: { type: string, format: uuid } }
    requestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    friendId: { name: friendId, in: path, required: true, schema: { type: string, format: uuid } }

  schemas:
    CreateUserRequest:
      type: object
      required: [email, password, firstName, lastName, timezone]
      properties:
        email: { type: string, format: email, description: Trimmed and lowercased. }
        password: { type: string, minLength: 8, maxLength: 128 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        nickname: { type: [string, "null"], minLength: 1, maxLength: 50 }
        timezone: { type: string, description: IANA name, e.g. America/Chicago. }

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        nickname: { type: [string, "null"], minLength: 1, maxLength: 50 }

    Friend:
      type: object
      required: [id, firstName, lastName, nickname, canSeeLocation, canSeeNotes]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        nickname: { type: [string, "null"] }
        canSeeLocation: { type: boolean, description: The user lets this friend see their location. }
        canSeeNotes: { type: boolean, description: The user lets this friend see their status notes. }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: Matched ignoring case. }
        password: { type: string, minLength: 1, maxLength: 128 }

    User:
      type: object
      required: [id, email, firstName, lastName, nickname, timezone, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        nickname: { type: [string, "null"] }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateLocationRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: [number, "null"], minimum: 0 }

    ActivitySummary:
      type: object
      required: [id, name, iconId, isCustom]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        iconId: { type: [string, "null"], format: uuid }
        isCustom: { type: boolean }

    NoteRequest:
      type: object
      required: [id, direction, otherUser, activity, status, isExpired, createdAt, expiresAt, reply]
      properties:
        id: { type: string, format: uuid }
        direction: { type: string, enum: [INCOMING, OUTGOING], description: INCOMING means the user was asked. }
        otherUser:
          type: object
          required: [id, firstName, lastName, nickname]
          properties:
            id: { type: string, format: uuid }
            firstName: { type: string }
            lastName: { type: string }
            nickname: { type: [string, "null"] }
        activity:
          oneOf:
            - $ref: "#/components/schemas/ActivitySummary"
            - { type: "null" }
        status: { type: string, enum: [PENDING, ANSWERED, DECLINED] }
        isExpired: { type: boolean, description: "Pending past expiresAt; can no longer be answered." }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        reply:
          oneOf:
            - type: object
              required: [text, placeLabel, location, respondedAt]
              properties:
                text: { type: string }
                placeLabel: { type: [string, "null"] }
                location:
                  oneOf:
                    - type: object
                      required: [latitude, longitude]
                      properties: { latitude: { type: number }, longitude: { type: number } }
                    - { type: "null" }
                respondedAt: { type: string, format: date-time }
            - { type: "null" }

    ReplyToNoteRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }
        placeLabel: { type: [string, "null"], maxLength: 100, description: "e.g. PCL, 3rd floor" }
        latitude: { type: [number, "null"], description: Send with longitude, or neither. }
        longitude: { type: [number, "null"] }

    UserWithStatus:
      type: object
      required: [id, firstName, lastName, nickname, status]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        nickname: { type: [string, "null"] }
        status:
          description: The newest active status, or null.
          oneOf:
            - { $ref: "#/components/schemas/Status" }
            - { type: "null" }

    CreateActivityRequest:
      type: object
      required: [name, defaultDurationMinutes]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, description: Unique per user, ignoring case. }
        defaultDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }

    Activity:
      type: object
      required: [id, ownerId, name, iconId, defaultDurationMinutes, isCustom, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: [string, "null"], format: uuid, description: Null for standard activities. }
        name: { type: string }
        iconId: { type: [string, "null"], format: uuid }
        defaultDurationMinutes: { type: integer }
        isCustom: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateStatusRequest:
      type: object
      required: [activityId]
      properties:
        activityId: { type: string, format: uuid, description: A standard activity or one of the user's own. }
        note: { type: [string, "null"], maxLength: 280 }
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future. Defaults to now + the activity's defaultDurationMinutes.

    Status:
      type: object
      required: [id, userId, note, source, startedAt, expiresAt, createdAt, updatedAt, activity]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        note: { type: [string, "null"] }
        source: { type: string, enum: [MANUAL, CALENDAR, LOCATION, AUTOMATED] }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        activity:
          type: object
          required: [id, name, iconId, isCustom]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            iconId: { type: [string, "null"], format: uuid }
            isCustom: { type: boolean }

    CalendarEvent:
      type: object
      required: [id, title, location, startAt, endAt, allDay, status, responseStatus, hasOtherAttendees, videoCallUrl, eventType, free, becomesStatus]
      properties:
        id: { type: string }
        title: { type: [string, "null"] }
        location: { type: [string, "null"] }
        startAt: { type: string, format: date-time, description: "All-day events start at 00:00 UTC of their date." }
        endAt: { type: string, format: date-time }
        allDay: { type: boolean }
        status: { type: string, enum: [confirmed, tentative] }
        responseStatus:
          type: [string, "null"]
          enum: [needsAction, declined, tentative, accepted, null]
          description: The user's own answer; null when they're the only person on the event.
        hasOtherAttendees: { type: boolean }
        videoCallUrl: { type: [string, "null"], format: uri }
        eventType: { type: string, description: default, focusTime, outOfOffice, workingLocation, birthday or fromGmail. }
        free: { type: boolean, description: Marked "Free" in Google. }
        becomesStatus: { type: boolean, description: Whether a status will be created when the event starts. }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, CONFLICT, RATE_LIMITED, INTERNAL]
            message: { type: string }

  responses:
    ValidationFailed:
      description: The request body or parameters are invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing or invalid API key.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Not allowed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: The user or resource doesn't exist, or was deleted.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Duplicate email or activity name.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
